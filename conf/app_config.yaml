    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3306
  user: didilili
  password: ${oc.env:DB_META_PASSWORD,dili123}
  database: meta
  connect_timeout_seconds: 10
  query_timeout_seconds: 10

db_dw:
  host: localhost
  port: 3306
  user: didilili
