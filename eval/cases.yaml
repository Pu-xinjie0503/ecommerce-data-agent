    must_contain_sql:
      - 食品饮料
    forbidden_sql:
      - 手机数码
    difficulty: easy
    description: 验证商品品类字段值召回和销售额指标生成。

  - id: p2_006
    query: 统计手机数码品类的销量
    expected_tables:
      - fact_order
      - dim_product
    expected_metrics:
