      - dim_product
    expected_metrics:
      - 订单数
    expected_values:
      - 美的
      - 2025
      - Q1
    must_contain_sql:
      - 美的
      - 2025
      - Q1
    forbidden_sql:
      - 华北
    difficulty: medium
    description: 验证品牌过滤、季度日期过滤和订单数指标组合。

  - id: p2_017
    query: 按大区统计食品饮料品类的销售额
    expected_tables:
      - fact_order
      - dim_product
    expected_metrics:
      - 销售额
    expected_values:
      - 食品饮料
    must_contain_sql:
      - 食品饮料
      - GROUP BY
    forbidden_sql:
      - 手机数码
    difficulty: medium
