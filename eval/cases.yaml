cases:
  - id: p2_001
    query: 华北地区的总销售额
    expected_tables:
      - fact_order
    expected_metrics:
      - 销售额
    expected_values:
      - 华北
    must_contain_sql:
      - 华北
    forbidden_sql: []
    difficulty: easy
    description: 验证大区字段值 exact-first 召回和销售额指标生成。

  - id: p2_002
    query: 华东地区的总销售额
    expected_tables:
      - fact_order
    expected_metrics:
      - 销售额
    expected_values:
      - 华东
    must_contain_sql:
      - 华东
    forbidden_sql:
      - 华北
    difficulty: easy
    description: 验证华东大区过滤不会误用华北。

  - id: p2_003
    query: 统计华南大区的订单数
    expected_tables:
      - fact_order
    expected_metrics:
      - 订单数
    expected_values:
      - 华南
    must_contain_sql:
      - 华南
    forbidden_sql:
      - 华北
      - 华东
    difficulty: easy
    description: 验证华南大区过滤和订单数指标生成。

  - id: p2_004
    query: 统计美的品牌的销售额
    expected_tables:
      - fact_order
      - dim_product
    expected_metrics:
      - 销售额
    expected_values:
      - 美的
    must_contain_sql:
      - 美的
    forbidden_sql:
      - 华北
      - 华东
    difficulty: easy
    description: 验证品牌字段值召回和销售额指标生成。

  - id: p2_005
    query: 统计食品饮料品类的销售额
    expected_tables:
      - fact_order
      - dim_product
    expected_metrics:
