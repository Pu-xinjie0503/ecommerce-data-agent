      - 20250331
    forbidden_sql:
      - GROUP BY
    difficulty: easy
    description: 验证单月销售额统计不应额外引入分组。

  - id: p2_014
    query: 统计销售额
    expected_tables:
      - fact_order
    expected_metrics:
      - 销售额
    expected_values: []
    must_contain_sql:
      - SELECT
    forbidden_sql:
      - 华北
      - 华东
      - 华南
    difficulty: easy
    description: 验证泛问销售额时不应凭空添加地区过滤。

  - id: p2_015
    query: 对比华北和华东的销售额
    expected_tables:
      - fact_order
    expected_metrics:
      - 销售额
    expected_values:
