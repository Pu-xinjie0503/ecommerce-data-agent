    expected_values:
      - 手机数码
    must_contain_sql:
      - 手机数码
    forbidden_sql:
      - 食品饮料
    difficulty: easy
    description: 验证手机数码品类过滤和销量指标生成。

  - id: p2_007
    query: 按会员等级统计 2025 年第一季度的订单数和销售额
    expected_tables:
      - fact_order
      - dim_user
    expected_metrics:
      - 订单数
      - 销售额
    expected_values:
      - 2025
      - Q1
    must_contain_sql:
      - GROUP BY
      - 2025
      - Q1
    forbidden_sql:
      - 2024-
    difficulty: medium
    description: 验证会员等级分组、季度日期边界和双指标生成。

  - id: p2_008
    query: 统计 2025 年 3 月各商品品类的销量和销售额
    expected_tables:
      - fact_order
      - dim_product
    expected_metrics:
      - 销量
      - 销售额
    expected_values:
      - 20250301
      - 20250331
    must_contain_sql:
      - GROUP BY
      - 20250301
      - 20250331
    forbidden_sql:
      - 2025-02
    difficulty: medium
    description: 验证月度日期过滤、商品品类分组和多指标生成。

  - id: p2_009
    query: 统计 2025 年第一季度各大区的 GMV，并按 GMV 从高到低排序
    expected_tables:
      - fact_order
    expected_metrics:
      - GMV
    expected_values:
      - 2025
      - Q1
    must_contain_sql:
      - GROUP BY
      - ORDER BY
      - DESC
      - 2025
      - Q1
    forbidden_sql:
      - ASC
    difficulty: medium
    description: 验证季度日期过滤、大区分组和 GMV 降序排序。

  - id: p2_010
    query: 统计华北地区美的品牌的销售额
    expected_tables:
      - fact_order
      - dim_product
    expected_metrics:
      - 销售额
    expected_values:
      - 华北
      - 美的
    must_contain_sql:
      - 华北
      - 美的
    forbidden_sql:
      - 华东
    difficulty: medium
    description: 验证大区和品牌两个过滤条件同时生效。

  - id: p2_011
    query: 统计华东地区食品饮料品类的销量
    expected_tables:
