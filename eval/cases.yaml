      - 华东
    must_contain_sql:
      - 华北
      - 华东
      - GROUP BY
    forbidden_sql:
      - 华南
    difficulty: medium
    description: 验证多地区对比问法能同时保留两个地区值。

  - id: p2_016
    query: 统计 2025 年第一季度美的品牌的订单数
    expected_tables:
