      - dim_product
    expected_metrics:
      - 销量
    expected_values:
      - 华东
      - 食品饮料
    must_contain_sql:
      - 华东
      - 食品饮料
    forbidden_sql:
      - 华北
      - 手机数码
    difficulty: medium
    description: 验证大区和商品品类组合过滤。

  - id: p2_012
    query: 统计 2025 年第一季度华南大区的销售额
    expected_tables:
      - fact_order
    expected_metrics:
      - 销售额
    expected_values:
      - 华南
      - 2025
      - Q1
    must_contain_sql:
      - 华南
      - 2025
      - Q1
    forbidden_sql:
      - 2024-
    difficulty: medium
    description: 验证日期范围和大区过滤组合。

  - id: p2_013
    query: 统计 2025 年 3 月的销售额
    expected_tables:
      - fact_order
    expected_metrics:
      - 销售额
    expected_values:
